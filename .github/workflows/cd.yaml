name: Python CD

on:
  repository_dispatch:
    types:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Clone application repository
        run: |
          git clone https://github.com/Deepak1125/Knowledge-base-Search-Engine.git

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          cd Knowledge-base-Search-Engine

          docker build \
            -t deepakchandra1125/knowledge-base-search-engine:${{ github.event.client_payload.tag }} \
            -t deepakchandra1125/knowledge-base-search-engine:latest .

      - name: Push Docker image
        run: |
          docker push deepakchandra1125/knowledge-base-search-engine:${{ github.event.client_payload.tag }}
          docker push deepakchandra1125/knowledge-base-search-engine:latest

      - name: Update docker-compose.yaml
        run: |
          sed -i \
          "s|image:.*|image: deepakchandra1125/knowledge-base-search-engine:${{ github.event.client_payload.tag }}|" \
          docker-compose.yaml

      - name: Commit deployment changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docker-compose.yaml

          git commit -m "Deploy image ${{ github.event.client_payload.tag }}" || echo "No changes"

          git push